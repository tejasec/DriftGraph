[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftgraph"
version = "0.1.0"
description = "Local-first GraphRAG knowledge graph generator and explorer for Markdown notes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DriftGraph Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.5.0",
    "gensim>=4.3.0",
    "networkx>=3.2",
    "faiss-cpu>=1.8.0",
    "aiosqlite>=0.20.0",
    "mistune>=3.0.0",
    "python-frontmatter>=1.0.0",
    "aiofiles>=23.2.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "leidenalg>=0.10.0",
    "python-louvain>=0.16.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.32",
    "fa2-modified>=0.4",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["driftgraph*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
driftgraph = "driftgraph.main:cli_entrypoint"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
