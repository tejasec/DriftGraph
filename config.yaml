app:
  name: "DriftGraph"
  version: "0.1.0"
  debug: true

paths:
  notes_dir: "./data/notes"
  data_dir: "./data"
  exports_dir: "./data/exports"

database:
  sqlite_path: "./data/driftgraph.db"
  vector_index_path: "./data/faiss.index"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32
  normalize: true
  dimension: 384

llm:
  provider: ollama            # "ollama" | "openai_compatible"
  base_url: http://localhost:11434/v1
  model: llama3.1:8b-instruct-q4_K_M
  api_key_env: LLM_API_KEY
  temperature: 0.1
  max_tokens: 2048
  timeout: 120

graph:
  community_resolution: 1.0
  min_community_size: 2
  max_levels: 3
  similarity_threshold: 0.70

retrieval:
  top_k: 8
  hybrid_alpha: 0.5  # 0=vector only, 1=keyword only

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

eval:
  ragas_metrics: ["context_precision", "faithfulness", "answer_relevance"]
  benchmark_runs: 3

ocr:
  engine: "tesseract"
  available_engines: ["tesseract", "google_vision", "local"]
  google_vision_api_key: null
  speed_mode: "balanced"  # fast, balanced, accurate
  psm: 6
  lang: "eng"
  dpi: 300
  min_confidence: 60.0
  error_confidence_threshold: 60.0
  table_detection: true
  layout_preservation: true
  batch_concurrency: 3
  cache_dir: "./data/ocr_cache"
